name: Tests

# Se déclenche automatiquement à chaque push et à chaque pull request
# sur la branche main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Installer les navigateurs Playwright
        run: playwright install --with-deps chromium

      - name: Démarrer le serveur en arrière-plan
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          echo "Attente que le serveur soit prêt..."
          for i in $(seq 1 20); do
            curl -s http://127.0.0.1:8000/api/pieces > /dev/null && break
            sleep 1
          done

      - name: Lancer la suite de tests (génère les données Allure)
        id: tests
        run: pytest tests/ -v --alluredir=allure-results
        continue-on-error: true  # on veut publier le rapport même si un test échoue
 
      - name: Générer le rapport Allure (avec historique des exécutions précédentes)
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
 
      - name: Publier le rapport sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
 
      - name: Faire échouer le job si des tests ont échoué
        if: steps.tests.outcome == 'failure'
        run: exit 1